name: TURC Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/build.mjs'
      - 'capacitor.config.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turc-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and sync the shared app
        run: |
          pnpm test
          pnpm android:sync
      - name: Build Android device APK
        working-directory: android
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify and package APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/TURC-Android.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --print-certs artifacts/TURC-Android.apk
          badging=$("$tools/aapt" dump badging artifacts/TURC-Android.apk)
          version=$(node -p "require('./package.json').version")
          grep -F "package: name='org.turc.clubhouse' versionCode='$GITHUB_RUN_NUMBER' versionName='$version'" <<< "$badging"
          unzip -t artifacts/TURC-Android.apk
          cp www/build-info.json artifacts/build-info.json
          cd artifacts
          sha256sum TURC-Android.apk > SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TURC-Android-${{ github.run_number }}
          path: |
            artifacts/TURC-Android.apk
            artifacts/SHA256SUMS.txt
            artifacts/build-info.json
          retention-days: 7
          if-no-files-found: error
