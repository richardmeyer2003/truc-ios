name: TURC iOS

on:
  push:
    branches: [main]
    tags: ['ios-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turc-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Check native project and shell syntax
        run: |
          python3 scripts/check-native.py
          bash -n scripts/build-unsigned-ipa.sh

  unsigned-ipa:
    needs: checks
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ios-') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-ios]'))
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec cap sync ios
      - name: Build device app and package unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TURC-unsigned-${{ github.run_number }}
          path: |
            artifacts/TURC-unsigned.ipa
            artifacts/SHA256SUMS.txt
            artifacts/build-info.json
            artifacts/README.txt
          retention-days: 3
          if-no-files-found: error
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TURC-build-diagnostics-${{ github.run_number }}
          path: build/xcodebuild.log
          retention-days: 1
